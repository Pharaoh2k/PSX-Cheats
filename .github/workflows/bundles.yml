name: Publish library bundles

on:
  push:
    branches: [main]
    paths:
      - ShnExt/**
      - Covers/**
      - metadata.json
      - tools/**
      - tests/**
      - requirements.txt
      - .github/workflows/bundles.yml
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: write

concurrency:
  group: library-bundles
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Build bounded verified bundles
        run: python tools/build_bundles.py --output dist
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish complete generation
        run: python tools/publish_bundles.py --output dist
        env:
          GH_TOKEN: ${{ github.token }}
